<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bjorn Cyberviking - Network</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <script src="scripts/network.js" defer></script>
    <script>fetch('/version').then(r=>r.json()).then(d=>{document.title='Bjorn v'+d.version+' - Network';});</script>

</head>
<body>
    <div class="toolbar" id="mainToolbar">
        <button type="button" onclick="window.location.href='/index.html'" title="Playground">
            <img src="/images/console_icon.png" alt="Bjorn" style="height: 50px;">
        </button>
        <button type="button" onclick="window.location.href='/config.html'" title="Config">
            <img src="/images/config_icon.png" alt="Icon_config" style="height: 50px;">
        </button>
        <button type="button" onclick="window.location.href='/network.html'" title="Network">
            <img src="/images/network_icon.png" alt="Icon_network" style="height: 50px;">
        </button>
        <button type="button" onclick="window.location.href='/netkb.html'" title="NetKB">
            <img src="/images/netkb_icon.png" alt="Icon_netkb" style="height: 50px;">
        </button>
        <button type="button" onclick="window.location.href='/credentials.html'" title="Credentials">
            <img src="/images/cred_icon.png" alt="Icon_cred" style="height: 50px;">
        </button>
        <button type="button" onclick="window.location.href='/loot.html'" title="Loot">
            <img src="/images/loot_icon.png" alt="Icon_loot" style="height: 50px;">
        </button>
    </div>
    <div class="console-toolbar">
        <button type="button" class="toolbar-button" onclick="adjustNetworkFontSize(-1)" title="-">
            <img src="/images/less.png" alt="Icon_less" style="height: 50px;">
        </button>
   
        <button id="toggle-toolbar" type="button" class="toolbar-button" onclick="toggleNetworkToolbar()" data-open="false">
            <img id="toggle-icon" src="/images/hide.png" alt="Toggle Toolbar" style="height: 50px;">
        </button>

        <button type="button" class="toolbar-button" onclick="adjustNetworkFontSize(1)" title="+">
            <img src="/images/plus.png" alt="Icon_plus" style="height: 50px;">
        </button>

    </div>
    <div class="network-container">
        <div id="network-table" class="scrollable-table">
            <!-- The table will be inserted here by JavaScript -->
        </div>
    </div>
</body>
</html>
