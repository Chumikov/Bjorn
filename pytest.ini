[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --timeout=15
    --tb=short
    --cov
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=45
    --cov-config=.coveragerc
filterwarnings =
    ignore::DeprecationWarning
    ignore::ResourceWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring in-process network servers
